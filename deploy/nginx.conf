# ---------------------------------------------------------------------------
# TEAL LeadConnect — static hosting.
#
# This server block is the whole web tier. It answers on port 80 inside the
# container; TLS is terminated by the reverse proxy in front of it, which is
# what holds the certificate. See DEPLOY.md.
# ---------------------------------------------------------------------------

server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Written by docker-entrypoint.sh at start-up: it names the configured
  # Supabase origin, which cannot be known when this file is written.
  include /run/leadconnect/csp.conf;

  # Nothing here identifies the version of nginx to someone probing it.
  server_tokens off;

  # --- security headers ----------------------------------------------------
  # always: applied to error responses too, not only 200s.
  add_header Content-Security-Policy   $leadconnect_csp always;
  add_header X-Content-Type-Options    "nosniff" always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options           "DENY" always;
  # The app asks for none of these. Saying so stops a future dependency from
  # quietly asking on its behalf.
  add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
  # A booth tablet on a venue's wifi should still refuse to downgrade.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # --- compression ---------------------------------------------------------
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css text/javascript application/javascript
             application/json image/svg+xml application/manifest+json;

  # --- caching -------------------------------------------------------------
  # None of the filenames are content-hashed, because there is no build step to
  # hash them. So nothing may be cached immutably: a long max-age here would
  # strand a browser on an old js/store.js against a new schema, with no way to
  # clear it short of telling people to empty their site data. Validation on
  # every request is cheap — these are small files and a 304 costs nothing.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    # add_header inside a location replaces the inherited set rather than
    # adding to it, so the security headers have to be repeated here.
    add_header Content-Security-Policy   $leadconnect_csp always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }

  # Which project this deployment points at. Never cached anywhere: a stale
  # copy sends a reconfigured deployment at the previous database.
  # Generated at start-up onto a tmpfs rather than baked into the image, so
  # the container's own filesystem can stay read-only.
  location = /config.json {
    alias /run/leadconnect/config.json;
    add_header Cache-Control "no-store" always;
    add_header Content-Type "application/json" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # A stale service worker outlives every other kind of stale file, because it
  # decides what the others are allowed to be.
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
    add_header Content-Type "text/javascript" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # The one genuinely immutable file: its name carries its version, and a new
  # release changes the name.
  location = /vendor/supabase-js.esm.js {
    add_header Cache-Control "public, max-age=2592000" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Nothing in the repository that is not part of the app should be reachable
  # if it ever ends up in the image by accident.
  location ~ /\.(git|env) { deny all; return 404; }
  location ~ ^/(supabase|tools|deploy)/ { deny all; return 404; }

  location = /favicon.ico { log_not_found off; access_log off; }
}
