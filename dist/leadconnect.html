/* ===== css/tokens.css ===== */
/* ==========================================================================
   TEAL LeadConnect — design tokens
   --------------------------------------------------------------------------
   One source of truth for colour, type, space, radius, elevation and motion.
   Nothing downstream may hard-code a hex value.

   Themes: light is the base; dark is a *selected* set of steps, not an
   inversion. Both are declared under the media query (OS preference) and the
   [data-theme] attribute (explicit user choice), so the toggle wins in both
   directions.
   ========================================================================== */

:root {
  color-scheme: light;

  /* ---- brand -------------------------------------------------------------
     Cyan and grey are taken from the TEAL corporate mark. The 500 step is the
     mark's own cyan; the rest are steps around it for UI state. */
  --teal-brand:        #00a9b5;
  --teal-brand-dark:   #007e88;
  --teal-brand-light:  #4fdfd2;
  --teal-accent:       #00c2b8;
  --teal-grey:         #808285;

  --brand-50:  #e6f7f8;
  --brand-100: #b8e9ec;
  --brand-200: #7fd6dc;
  --brand-300: #43c2ca;
  --brand-400: #12b0ba;
  --brand-500: #00a9b5;
  --brand-600: #00909b;
  --brand-700: #00737c;
  --brand-800: #005a61;
  --brand-900: #003f44;

  /* ---- surfaces & ink ---------------------------------------------------- */
  --bg-primary:      #f4f6f9;
  --bg-secondary:    #eaeef4;
  --surface:         #ffffff;
  --surface-elevated:#ffffff;
  --surface-sunken:  #f0f3f7;
  --surface-hover:   #f3f6fa;

  --border:          #d9e0ea;
  --border-strong:   #b9c4d3;
  --border-subtle:   #e8edf3;

  --text-primary:    #101a26;
  --text-secondary:  #47566b;
  --text-muted:      #6c7d94;
  --text-inverse:    #ffffff;
  --text-on-brand:   #ffffff;

  /* ---- semantic ----------------------------------------------------------
     Reserved for state. Never reused as a chart series colour. */
  --success:     #0f8a4d;
  --success-bg:  #e3f5eb;
  --warning:     #a86800;
  --warning-bg:  #fdf1dd;
  --danger:      #c62828;
  --danger-bg:   #fdeaea;
  --info:        #1d5fbf;
  --info-bg:     #e7effb;

  /* ---- lead temperature --------------------------------------------------
     A state scale, not an identity scale: always paired with a text label. */
  --temp-strategic: #6a1b9a;
  --temp-hot:       #c62828;
  --temp-warm:      #a86800;
  --temp-cold:      #1d5fbf;

  /* ---- chart palette -----------------------------------------------------
     Six categorical slots, assigned in fixed order and never cycled. Anchored
     on the TEAL brand hue. Validated for the light surface: lightness band,
     chroma floor, adjacent-pair CVD separation, normal-vision separation and
     contrast all pass. Slots 4 and 5 fall under 3:1 against white, so any
     chart using them ships direct labels or the table view. */
  --chart-1: #00949e;
  --chart-2: #eb6834;
  --chart-3: #4a3aa7;
  --chart-4: #eda100;
  --chart-5: #e87ba4;
  --chart-6: #2a78d6;
  --chart-other: #8a99ad;

  /* Sequential ramp — one hue, light to dark, for magnitude. */
  --seq-1: #d7f0f2;
  --seq-2: #a6dfe4;
  --seq-3: #6bc9d1;
  --seq-4: #2fadb8;
  --seq-5: #00909b;
  --seq-6: #00707a;

  /* Diverging — two poles, neutral grey midpoint. */
  --div-neg-2: #b3491f;
  --div-neg-1: #e9a184;
  --div-mid:   #e3e6ea;
  --div-pos-1: #7cc9cf;
  --div-pos-2: #00808a;

  --chart-grid:  #e6ebf2;
  --chart-axis:  #c3cddb;
  --chart-track: #eef1f6;

  /* ---- typography -------------------------------------------------------- */
  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;

  --fs-display: 2.125rem;
  --fs-h1:      1.5rem;
  --fs-h2:      1.1875rem;
  --fs-h3:      0.9375rem;
  --fs-body:    0.875rem;
  --fs-sm:      0.8125rem;
  --fs-caption: 0.75rem;
  --fs-micro:   0.6875rem;
  --fs-kpi:     2rem;

  --lh-tight: 1.15;
  --lh-snug:  1.35;
  --lh-body:  1.55;

  --ls-caps: 0.08em;
  --ls-tight: -0.011em;

  /* ---- space, radius, elevation, motion ---------------------------------- */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px; --sp-12: 48px;

  --r-sm: 6px; --r-md: 9px; --r-lg: 12px; --r-xl: 16px; --r-pill: 999px;

  --shadow-1: 0 1px 2px rgba(16, 26, 38, .06), 0 1px 3px rgba(16, 26, 38, .04);
  --shadow-2: 0 2px 4px rgba(16, 26, 38, .06), 0 4px 12px rgba(16, 26, 38, .07);
  --shadow-3: 0 8px 24px rgba(16, 26, 38, .12), 0 2px 6px rgba(16, 26, 38, .07);

  --ease: cubic-bezier(.2, .7, .3, 1);
  --dur-fast: 110ms;
  --dur:      170ms;

  --sidebar-w: 244px;
  --sidebar-w-collapsed: 68px;
  --topbar-h: 58px;

  /* ---- logo -------------------------------------------------------------- */
  --logo-teal: #00a9b5;
  --logo-grey: #808285;
}

/* ---- dark theme ----------------------------------------------------------
   The same values are declared twice on purpose: once under the media query
   so "System" follows the OS, and once under [data-theme="dark"] so an
   explicit choice wins. The :not([data-theme="light"]) guard lets an explicit
   light choice beat OS-dark. Keep the two blocks in sync. */
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;

    --bg-primary:      #070b12;
    --bg-secondary:    #0b1220;
    --surface:         #0f1724;
    --surface-elevated:#141f30;
    --surface-sunken:  #0a1018;

    --border:          #1f2c3f;

    --text-primary:    #e8eef6;
    --text-secondary:  #a4b4c8;
    --text-muted:      #7789a0;
    --text-inverse:    #070b12;
    --text-on-brand:   #04222a;

    --brand-500: #16b3bd;
    --brand-600: #00a9b5;
    --teal-brand-light: #4fdfd2;

    --success:     #35c07a;
    --success-bg:  #10281d;
    --warning:     #e0a13a;
    --warning-bg:  #2b2011;
    --danger:      #ef6a6a;
    --danger-bg:   #2d1618;
    --info:        #5c9df5;
    --info-bg:     #101f34;

    --temp-strategic: #b07de0;
    --temp-hot:       #ef6a6a;
    --temp-warm:      #e0a13a;
    --temp-cold:      #5c9df5;

    --chart-1: #0fa6ae;
    --chart-2: #d95926;
    --chart-3: #9085e9;
    --chart-4: #c98500;
    --chart-5: #d55181;
    --chart-6: #3987e5;
    --chart-other: #64748b;

    --seq-1: #0d3339;
    --seq-2: #114a52;
    --seq-3: #14646e;
    --seq-4: #13818c;
    --seq-5: #10a0ab;
    --seq-6: #3ec6cd;

    --div-neg-2: #d95926;
    --div-neg-1: #8a4326;
    --div-mid:   #2a3648;
    --div-pos-1: #12707a;
    --div-pos-2: #0fa6ae;

    --chart-grid:  #1a2536;
    --chart-axis:  #2c3c53;
    --chart-track: #16202f;

    --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
    --shadow-2: 0 2px 6px rgba(0, 0, 0, .45);
    --shadow-3: 0 12px 32px rgba(0, 0, 0, .55);

    --logo-teal: #2ec9d0;
    --logo-grey: #9aa3ad;
  }
}

/* Respect a stated preference for less motion (§38). */
@media (prefers-reduced-motion: reduce) {
  :root { --dur-fast: 0ms; --dur: 0ms; }
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
    scroll-behavior: auto !important;
  }
}

/* Forced-colors / high-contrast: let the OS palette through and keep the
   structural borders that carry meaning. */
@media (forced-colors: active) {
  .kpi, .card, .btn, .chip, .pill { border: 1px solid CanvasText; }
  .chart svg { forced-color-adjust: none; }
}


/* ===== css/base.css ===== */
/* ==========================================================================
   Reset, typography scale and accessibility primitives.
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }

html {
  /* Deliberately left at the browser default so 1rem === 16px and the token
     scale means what it says. Setting a size here rescales every rem token. */
  margin: 0;
  background: var(--bg-primary);
}

body {
  margin: 0;
  padding: 0;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

body { min-height: 100dvh; overscroll-behavior-y: none; }

h1, h2, h3, h4, p, figure, dl, dd, ol, ul { margin: 0; }
ol, ul { padding: 0; list-style: none; }
img, svg { max-width: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: var(--brand-600); text-decoration: none; }
a:hover { text-decoration: underline; }
input, select, textarea { font: inherit; color: inherit; }
table { border-collapse: collapse; width: 100%; }

/* Focus is always visible and never removed — only restyled (§38). */
:focus-visible {
  outline: 2px solid var(--brand-500);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}
:focus:not(:focus-visible) { outline: none; }

.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip-path: inset(50%); white-space: nowrap; border: 0;
}

.skip-link {
  position: absolute; top: -100px; left: var(--sp-3); z-index: 200;
  padding: var(--sp-3) var(--sp-4); border-radius: var(--r-md);
  background: var(--brand-600); color: #fff; font-weight: 600;
}
.skip-link:focus { top: var(--sp-3); }

/* ---- type scale ---------------------------------------------------------- */
.t-display { font-size: var(--fs-display); font-weight: 700; letter-spacing: var(--ls-tight); line-height: var(--lh-tight); }
.t-h1  { font-size: var(--fs-h1);  font-weight: 650; letter-spacing: var(--ls-tight); line-height: var(--lh-tight); }
.t-h2  { font-size: var(--fs-h2);  font-weight: 620; line-height: var(--lh-snug); }
.t-h3  { font-size: var(--fs-h3);  font-weight: 600; line-height: var(--lh-snug); }
.t-body{ font-size: var(--fs-body); }
.t-sm  { font-size: var(--fs-sm); }
.t-cap { font-size: var(--fs-caption); color: var(--text-muted); }
.t-num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

.t-eyebrow {
  font-size: var(--fs-micro); font-weight: 650;
  letter-spacing: var(--ls-caps); text-transform: uppercase;
  color: var(--text-muted);
}

.muted  { color: var(--text-muted); }
.dim    { color: var(--text-secondary); }
.nowrap { white-space: nowrap; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.stack   { display: flex; flex-direction: column; }
.row     { display: flex; align-items: center; }
.gap-1 { gap: var(--sp-1); } .gap-2 { gap: var(--sp-2); }
.gap-3 { gap: var(--sp-3); } .gap-4 { gap: var(--sp-4); }
.grow  { flex: 1; min-width: 0; }
.mt-2 { margin-top: var(--sp-2); } .mt-3 { margin-top: var(--sp-3); }
.mt-4 { margin-top: var(--sp-4); } .mt-6 { margin-top: var(--sp-6); }

@media print {
  .no-print, .sidebar, .topbar, .tabbar, .cmdk { display: none !important; }
  body { background: #fff; }
  .main { margin: 0 !important; padding: 0 !important; }
  .card { break-inside: avoid; border-color: #ccc; box-shadow: none; }
}


/* ===== css/shell.css ===== */
/* ==========================================================================
   Application shell — sidebar, topbar, main region, mobile tab bar.
   ========================================================================== */

.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  min-height: 100dvh;
  transition: grid-template-columns var(--dur) var(--ease);
}
.app[data-collapsed="true"] { grid-template-columns: var(--sidebar-w-collapsed) 1fr; }

/* ---- sidebar ------------------------------------------------------------- */
.sidebar {
  position: sticky; top: 0; z-index: 40;
  display: flex; flex-direction: column;
  height: 100dvh;
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding-top: env(safe-area-inset-top);
}

.brand {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-4) var(--sp-4) var(--sp-3);
  border-bottom: 1px solid var(--border-subtle);
  min-height: var(--topbar-h);
}
.brand-logo { flex-shrink: 0; display: block; width: 34px; height: 34px; }
.brand-text { min-width: 0; }
.brand-parent {
  display: block; font-size: var(--fs-micro); font-weight: 700;
  letter-spacing: var(--ls-caps); text-transform: uppercase;
  color: var(--text-muted); line-height: 1.2;
}
.brand-product {
  display: block; font-size: 0.9375rem; font-weight: 680;
  letter-spacing: var(--ls-tight); color: var(--text-primary); line-height: 1.25;
}
.app[data-collapsed="true"] .brand-text { display: none; }

.nav { flex: 1; overflow-y: auto; padding: var(--sp-3) var(--sp-2); }
.nav-group + .nav-group { margin-top: var(--sp-4); }
.nav-label {
  padding: var(--sp-2) var(--sp-3) var(--sp-1);
  font-size: var(--fs-micro); font-weight: 650;
  letter-spacing: var(--ls-caps); text-transform: uppercase; color: var(--text-muted);
}
.app[data-collapsed="true"] .nav-label { text-align: center; padding-inline: 0; font-size: 0; }
.app[data-collapsed="true"] .nav-label::after {
  content: "···"; font-size: var(--fs-caption); letter-spacing: 0;
}

.nav-item {
  position: relative;
  display: flex; align-items: center; gap: var(--sp-3);
  width: 100%; padding: var(--sp-2) var(--sp-3);
  border-radius: var(--r-md);
  color: var(--text-secondary); font-size: var(--fs-sm); font-weight: 500;
  text-decoration: none;
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.nav-item:hover { background: var(--surface-hover); color: var(--text-primary); text-decoration: none; }
.nav-item .ico { flex-shrink: 0; width: 18px; height: 18px; }
.nav-item[aria-current="page"] {
  background: color-mix(in srgb, var(--brand-500) 12%, transparent);
  color: var(--brand-600); font-weight: 600;
}
/* The active marker is a bar as well as a colour, so state never rides on
   colour alone (§38). */
.nav-item[aria-current="page"]::before {
  content: ""; position: absolute; left: -8px; top: 50%; translate: 0 -50%;
  width: 3px; height: 20px; border-radius: 0 3px 3px 0; background: var(--brand-500);
}
.nav-count {
  margin-left: auto; padding: 1px 7px; border-radius: var(--r-pill);
  background: var(--surface-sunken); color: var(--text-secondary);
  font-size: var(--fs-micro); font-weight: 650; font-variant-numeric: tabular-nums;
}
.nav-count[data-tone="urgent"] { background: var(--danger-bg); color: var(--danger); }
.app[data-collapsed="true"] .nav-item { justify-content: center; padding-inline: 0; }
.app[data-collapsed="true"] .nav-item .lbl,
.app[data-collapsed="true"] .nav-count { display: none; }

.sidebar-foot { border-top: 1px solid var(--border-subtle); padding: var(--sp-3); }
.userchip {
  display: flex; align-items: center; gap: var(--sp-3); width: 100%;
  padding: var(--sp-2); border-radius: var(--r-md); text-align: left;
}
.userchip:hover { background: var(--surface-hover); }
.avatar {
  flex-shrink: 0; display: grid; place-items: center;
  width: 32px; height: 32px; border-radius: 50%;
  background: color-mix(in srgb, var(--brand-500) 16%, transparent);
  color: var(--brand-600); font-size: var(--fs-micro); font-weight: 700;
}
.app[data-collapsed="true"] .userchip-text { display: none; }

.collapse-btn {
  display: flex; align-items: center; justify-content: center; gap: var(--sp-2);
  width: 100%; min-height: 34px; margin-top: var(--sp-2);
  border-radius: var(--r-md); color: var(--text-muted); font-size: var(--fs-caption);
}
.collapse-btn:hover { background: var(--surface-hover); color: var(--text-primary); }

/* ---- topbar -------------------------------------------------------------- */
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: var(--sp-3);
  height: var(--topbar-h);
  padding: 0 var(--sp-4);
  padding-top: env(safe-area-inset-top);
  background: color-mix(in srgb, var(--bg-primary) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}

.searchbtn {
  display: flex; align-items: center; gap: var(--sp-2);
  min-width: 0; max-width: 380px; flex: 1;
  min-height: 36px; padding: 0 var(--sp-3);
  border: 1px solid var(--border); border-radius: var(--r-md);
  background: var(--surface); color: var(--text-muted); font-size: var(--fs-sm);
}
.searchbtn:hover { border-color: var(--border-strong); }
.searchbtn kbd {
  margin-left: auto; padding: 1px 6px; border-radius: var(--r-sm);
  border: 1px solid var(--border); background: var(--surface-sunken);
  font-family: var(--font-sans); font-size: var(--fs-micro); color: var(--text-muted);
}

.iconbtn {
  position: relative;
  display: grid; place-items: center;
  width: 36px; height: 36px; flex-shrink: 0;
  border: 1px solid var(--border); border-radius: var(--r-md);
  background: var(--surface); color: var(--text-secondary);
}
.iconbtn:hover { background: var(--surface-hover); color: var(--text-primary); }
.iconbtn .dot {
  position: absolute; top: 5px; right: 5px;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--danger); border: 1.5px solid var(--surface);
}

.exsel {
  display: flex; align-items: center; gap: var(--sp-2);
  min-height: 36px; padding: 0 var(--sp-3);
  border: 1px solid var(--border); border-radius: var(--r-md);
  background: var(--surface); font-size: var(--fs-sm); font-weight: 550;
  max-width: 260px;
}
.exsel:hover { background: var(--surface-hover); }
.exsel .ico { color: var(--brand-500); flex-shrink: 0; }

.menu-btn { display: none; }

/* ---- main ---------------------------------------------------------------- */
.main { min-width: 0; display: flex; flex-direction: column; }
.view {
  flex: 1;
  width: 100%; max-width: 1440px;
  padding: var(--sp-5) var(--sp-6) var(--sp-12);
  margin-inline: auto;
}

.page-head {
  display: flex; flex-wrap: wrap; align-items: flex-end;
  justify-content: space-between; gap: var(--sp-3);
  margin-bottom: var(--sp-5);
}
.page-head h1 { font-size: var(--fs-h1); font-weight: 650; letter-spacing: var(--ls-tight); }
.page-head p { margin-top: 2px; font-size: var(--fs-sm); color: var(--text-secondary); max-width: 68ch; }
.page-actions { display: flex; flex-wrap: wrap; gap: var(--sp-2); }

/* ---- mobile -------------------------------------------------------------- */
.tabbar { display: none; }
.scrim { display: none; }

@media (max-width: 1024px) {
  .app, .app[data-collapsed="true"] { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed; inset: 0 auto 0 0; width: 272px;
    translate: -100% 0; transition: translate var(--dur) var(--ease);
    box-shadow: var(--shadow-3);
  }
  body[data-drawer="open"] .sidebar { translate: 0 0; }
  body[data-drawer="open"] .scrim {
    display: block; position: fixed; inset: 0; z-index: 35;
    background: rgba(4, 10, 18, .5);
  }
  .menu-btn { display: grid; }
  .view { padding: var(--sp-4) var(--sp-4) 96px; }
  .exsel { max-width: 150px; }
}

@media (max-width: 560px) {
  /* At phone width the topbar keeps only what a booth user needs in reach:
     menu, search, notifications and capture. Exhibition and connection
     status move into the drawer and the Command Center respectively. */
  .topbar { gap: var(--sp-2); padding-inline: var(--sp-3); }
  .exsel, #netdot, #theme-btn { display: none; }
  .searchbtn { flex: 1 1 auto; min-width: 0; }
  .searchbtn span { display: none; }
  #quickadd-btn { padding: 0 var(--sp-3); }
  #quickadd-btn .lbl { display: none; }
}

@media (max-width: 720px) {
  .tabbar {
    position: fixed; inset: auto 0 0 0; z-index: 38;
    display: grid; grid-template-columns: repeat(5, 1fr);
    background: color-mix(in srgb, var(--surface) 96%, transparent);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tabbar a {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; min-height: 54px; padding: var(--sp-2) 2px;
    font-size: var(--fs-micro); font-weight: 550; color: var(--text-muted);
    text-decoration: none;
  }
  .tabbar a[aria-current="page"] { color: var(--brand-600); }
  .tabbar a .ico { width: 20px; height: 20px; }
  .searchbtn kbd { display: none; }
  .exsel .lbl { display: none; }
}


/* ===== css/components.css ===== */
/* ==========================================================================
   Reusable components — cards, KPIs, buttons, badges, tables, charts,
   dialogs, empty/loading/error states.
   ========================================================================== */

/* ---- card ---------------------------------------------------------------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: var(--sp-4);
  box-shadow: var(--shadow-1);
}
.card-head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: var(--sp-3); margin-bottom: var(--sp-3);
}
.card-head h3 { font-size: var(--fs-h3); font-weight: 620; }
.card-head .t-cap { flex-shrink: 0; }
.card-sub { font-size: var(--fs-caption); color: var(--text-muted); margin-top: 2px; }

.grid { display: grid; gap: var(--sp-4); }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.grid-3 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.grid-4 { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.span-2 { grid-column: span 2; }
@media (max-width: 900px) { .span-2 { grid-column: span 1; } }

/* ---- KPI ----------------------------------------------------------------- */
.kpi {
  display: flex; flex-direction: column; gap: var(--sp-1);
  padding: var(--sp-4);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-lg); box-shadow: var(--shadow-1);
  text-decoration: none; color: inherit;
}
a.kpi:hover { border-color: var(--brand-400); text-decoration: none; box-shadow: var(--shadow-2); }
.kpi-label {
  font-size: var(--fs-micro); font-weight: 650;
  letter-spacing: var(--ls-caps); text-transform: uppercase; color: var(--text-muted);
}
.kpi-value {
  font-size: var(--fs-kpi); font-weight: 700; line-height: 1.05;
  letter-spacing: var(--ls-tight); font-variant-numeric: tabular-nums;
}
.kpi-foot { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-caption); }
.kpi-hint { color: var(--text-muted); font-size: var(--fs-caption); }

/* Trend carries an arrow glyph as well as a colour. */
.trend { display: inline-flex; align-items: center; gap: 3px; font-weight: 600; }
.trend[data-dir="up"]   { color: var(--success); }
.trend[data-dir="down"] { color: var(--danger); }
.trend[data-dir="flat"] { color: var(--text-muted); }

/* ---- buttons ------------------------------------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
  min-height: 36px; padding: 0 var(--sp-4);
  border: 1px solid transparent; border-radius: var(--r-md);
  background: var(--brand-600); color: #fff;
  font-size: var(--fs-sm); font-weight: 600; text-decoration: none;
  transition: filter var(--dur-fast) var(--ease);
}
.btn:hover { filter: brightness(1.08); text-decoration: none; }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
.btn-sec { background: var(--surface); color: var(--text-primary); border-color: var(--border); }
.btn-sec:hover { background: var(--surface-hover); filter: none; }
.btn-ghost { background: transparent; color: var(--text-secondary); }
.btn-ghost:hover { background: var(--surface-hover); color: var(--text-primary); filter: none; }
.btn-danger { background: var(--danger); }
.btn-sm { min-height: 30px; padding: 0 var(--sp-3); font-size: var(--fs-caption); }
.btn-lg { min-height: 46px; padding: 0 var(--sp-5); font-size: var(--fs-body); }
.btn-block { width: 100%; }

/* ---- badges & pills ------------------------------------------------------ */
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 9px; border-radius: var(--r-pill);
  border: 1px solid transparent;
  font-size: var(--fs-micro); font-weight: 650; letter-spacing: .02em;
  white-space: nowrap;
}
/* Temperature always ships a dot glyph plus the word, never colour alone. */
.pill[data-temp]::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill[data-temp="STRATEGIC"] { color: var(--temp-strategic); background: color-mix(in srgb, var(--temp-strategic) 12%, transparent); border-color: color-mix(in srgb, var(--temp-strategic) 30%, transparent); }
.pill[data-temp="HOT"]       { color: var(--temp-hot);       background: color-mix(in srgb, var(--temp-hot) 12%, transparent);       border-color: color-mix(in srgb, var(--temp-hot) 30%, transparent); }
.pill[data-temp="WARM"]      { color: var(--temp-warm);      background: color-mix(in srgb, var(--temp-warm) 14%, transparent);      border-color: color-mix(in srgb, var(--temp-warm) 32%, transparent); }
.pill[data-temp="COLD"]      { color: var(--temp-cold);      background: color-mix(in srgb, var(--temp-cold) 12%, transparent);      border-color: color-mix(in srgb, var(--temp-cold) 30%, transparent); }

.pill[data-tone="success"] { color: var(--success); background: var(--success-bg); }
.pill[data-tone="warning"] { color: var(--warning); background: var(--warning-bg); }
.pill[data-tone="danger"]  { color: var(--danger);  background: var(--danger-bg); }
.pill[data-tone="info"]    { color: var(--info);    background: var(--info-bg); }
.pill[data-tone="neutral"] { color: var(--text-secondary); background: var(--surface-sunken); }

.tag {
  display: inline-flex; align-items: center;
  padding: 3px 9px; border-radius: var(--r-sm);
  border: 1px solid var(--border); background: var(--surface-sunken);
  font-size: var(--fs-caption); color: var(--text-secondary);
}
.code {
  font-family: var(--font-mono); font-size: var(--fs-caption);
  letter-spacing: .02em; color: var(--brand-600);
}

/* ---- score dial ---------------------------------------------------------- */
.dial { display: block; flex-shrink: 0; }
.dial-track { stroke: var(--chart-track); }
.dial-fill  { stroke: var(--brand-500); stroke-linecap: round; }
.dial-fill[data-temp="STRATEGIC"] { stroke: var(--temp-strategic); }
.dial-fill[data-temp="HOT"]       { stroke: var(--temp-hot); }
.dial-fill[data-temp="WARM"]      { stroke: var(--temp-warm); }
.dial-fill[data-temp="COLD"]      { stroke: var(--temp-cold); }
.dial-num { font-size: 15px; font-weight: 700; fill: var(--text-primary); font-variant-numeric: tabular-nums; }
.dial-den { font-size: 8px; fill: var(--text-muted); }

/* ---- insight panel (§12) -------------------------------------------------- */
.insight {
  display: grid; gap: var(--sp-3);
  padding: var(--sp-4);
  border: 1px solid color-mix(in srgb, var(--brand-500) 30%, var(--border));
  border-left: 3px solid var(--brand-500);
  border-radius: var(--r-lg);
  background: color-mix(in srgb, var(--brand-500) 5%, var(--surface));
}
.insight-row { display: grid; grid-template-columns: 96px 1fr; gap: var(--sp-3); align-items: start; }
.insight-row dt {
  font-size: var(--fs-micro); font-weight: 650; letter-spacing: var(--ls-caps);
  text-transform: uppercase; color: var(--text-muted); padding-top: 2px;
}
.insight-row dd { font-size: var(--fs-sm); color: var(--text-primary); }
.insight-head { font-size: var(--fs-h3); font-weight: 620; }
@media (max-width: 560px) { .insight-row { grid-template-columns: 1fr; gap: 2px; } }

/* ---- next best action (§15) ----------------------------------------------- */
.nba {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4);
  border-radius: var(--r-lg);
  background: color-mix(in srgb, var(--brand-500) 10%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--brand-500) 32%, transparent);
}
.nba .ico { color: var(--brand-600); flex-shrink: 0; }
.nba-text { min-width: 0; flex: 1; }
.nba-text b { display: block; font-size: var(--fs-body); font-weight: 620; }
.nba-text span { font-size: var(--fs-caption); color: var(--text-secondary); }

/* ---- tables (§17) --------------------------------------------------------- */
.tablewrap {
  overflow-x: auto;
  border: 1px solid var(--border); border-radius: var(--r-lg);
  background: var(--surface);
}
table.data { font-size: var(--fs-sm); min-width: 900px; }
table.data caption { text-align: left; padding: var(--sp-3) var(--sp-4); font-size: var(--fs-caption); color: var(--text-muted); }
table.data th {
  position: sticky; top: 0; z-index: 1;
  text-align: left; padding: var(--sp-3) var(--sp-3);
  background: var(--surface-sunken);
  border-bottom: 1px solid var(--border);
  font-size: var(--fs-micro); font-weight: 650;
  letter-spacing: var(--ls-caps); text-transform: uppercase; color: var(--text-muted);
  white-space: nowrap;
}
table.data th button {
  display: inline-flex; align-items: center; gap: 4px;
  min-height: 30px; padding: 0 var(--sp-1); margin: -4px 0;
  border-radius: var(--r-sm); font: inherit; color: inherit;
}
table.data th button:hover { background: var(--surface-hover); }
table.data th[aria-sort] button { color: var(--text-primary); }
table.data td { padding: var(--sp-3); border-bottom: 1px solid var(--border-subtle); vertical-align: middle; }
table.data input[type="checkbox"] { width: 24px; height: 24px; accent-color: var(--brand-600); }
table.data tbody tr:last-child td { border-bottom: 0; }
table.data tbody tr:hover { background: var(--surface-hover); }
table.data tbody tr[data-selected="true"] { background: color-mix(in srgb, var(--brand-500) 8%, transparent); }
.num { text-align: right; font-variant-numeric: tabular-nums; }

/* ---- forms --------------------------------------------------------------- */
.field { display: block; margin-bottom: var(--sp-3); }
.field > span {
  display: block; margin-bottom: 5px;
  font-size: var(--fs-caption); font-weight: 600; color: var(--text-secondary);
}
.field > span .req { color: var(--danger); }
.input, .select, .textarea {
  width: 100%; min-height: 40px; padding: var(--sp-2) var(--sp-3);
  border: 1px solid var(--border); border-radius: var(--r-md);
  background: var(--surface); color: var(--text-primary); font-size: var(--fs-body);
}
.textarea { min-height: 84px; resize: vertical; line-height: var(--lh-body); }
.input:focus, .select:focus, .textarea:focus { border-color: var(--brand-500); }
.input::placeholder, .textarea::placeholder { color: var(--text-muted); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 var(--sp-3); }
@media (max-width: 560px) { .field-row { grid-template-columns: 1fr; } }

.chips { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.chip {
  min-height: 40px; padding: var(--sp-2) var(--sp-3);
  border: 1px solid var(--border); border-radius: var(--r-md);
  background: var(--surface); color: var(--text-secondary);
  font-size: var(--fs-sm); text-align: left;
}
.chip:hover { border-color: var(--border-strong); }
/* Selected chips carry a check glyph as well as the fill. */
.chip[aria-pressed="true"] {
  border-color: var(--brand-500); color: var(--brand-600); font-weight: 600;
  background: color-mix(in srgb, var(--brand-500) 10%, transparent);
}
.chip[aria-pressed="true"]::before { content: "✓ "; font-weight: 700; }

.checkbox { display: flex; align-items: flex-start; gap: var(--sp-3); min-height: 44px; padding: var(--sp-2) 0; cursor: pointer; }
.checkbox input { width: 22px; height: 22px; flex-shrink: 0; margin-top: 1px; accent-color: var(--brand-600); }
.checkbox span { font-size: var(--fs-sm); color: var(--text-secondary); line-height: var(--lh-body); }

/* ---- dialog / sheet ------------------------------------------------------ */
.dlg { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: var(--sp-4); }
.dlg-scrim { position: absolute; inset: 0; background: rgba(4, 10, 18, .55); }
.dlg-panel {
  position: relative; z-index: 1;
  width: min(560px, 100%); max-height: 86dvh; overflow-y: auto;
  background: var(--surface-elevated); border: 1px solid var(--border);
  border-radius: var(--r-xl); box-shadow: var(--shadow-3);
  padding: var(--sp-5);
}
.dlg-panel h2 { font-size: var(--fs-h2); font-weight: 620; margin-bottom: var(--sp-1); }
.dlg-foot { display: flex; gap: var(--sp-2); justify-content: flex-end; margin-top: var(--sp-5); }
@media (max-width: 560px) {
  .dlg { place-items: end center; padding: 0; }
  .dlg-panel { width: 100%; max-height: 92dvh; border-radius: var(--r-xl) var(--r-xl) 0 0; }
  .dlg-foot { flex-direction: column-reverse; }
  .dlg-foot .btn { width: 100%; }
}

/* ---- command palette (§35) ------------------------------------------------ */
.cmdk { position: fixed; inset: 0; z-index: 100; display: grid; place-items: start center; padding: 10vh var(--sp-4) var(--sp-4); }
.cmdk-panel {
  position: relative; z-index: 1; width: min(620px, 100%);
  background: var(--surface-elevated); border: 1px solid var(--border);
  border-radius: var(--r-xl); box-shadow: var(--shadow-3); overflow: hidden;
}
.cmdk-input {
  width: 100%; min-height: 52px; padding: 0 var(--sp-5);
  border: 0; border-bottom: 1px solid var(--border); background: transparent;
  font-size: var(--fs-h3);
}
.cmdk-input:focus { outline: none; }
.cmdk-list { max-height: 52vh; overflow-y: auto; padding: var(--sp-2); }
.cmdk-group { padding: var(--sp-2) var(--sp-3) var(--sp-1); font-size: var(--fs-micro); font-weight: 650; letter-spacing: var(--ls-caps); text-transform: uppercase; color: var(--text-muted); }
.cmdk-item {
  display: flex; align-items: center; gap: var(--sp-3); width: 100%;
  padding: var(--sp-2) var(--sp-3); border-radius: var(--r-md);
  font-size: var(--fs-sm); text-align: left; color: var(--text-primary);
}
.cmdk-item[data-active="true"] { background: color-mix(in srgb, var(--brand-500) 12%, transparent); }
.cmdk-item .ico { color: var(--text-muted); flex-shrink: 0; }
.cmdk-item .sub { margin-left: auto; font-size: var(--fs-micro); color: var(--text-muted); }
.cmdk-foot { display: flex; gap: var(--sp-4); padding: var(--sp-2) var(--sp-4); border-top: 1px solid var(--border); font-size: var(--fs-micro); color: var(--text-muted); }

/* ---- toast --------------------------------------------------------------- */
.toasts { position: fixed; z-index: 120; left: 50%; bottom: calc(var(--sp-6) + env(safe-area-inset-bottom)); translate: -50% 0; display: flex; flex-direction: column; gap: var(--sp-2); pointer-events: none; }
.toast {
  display: flex; align-items: center; gap: var(--sp-2);
  padding: var(--sp-3) var(--sp-4); border-radius: var(--r-md);
  background: var(--text-primary); color: var(--bg-primary);
  font-size: var(--fs-sm); font-weight: 550; box-shadow: var(--shadow-3);
}
.toast[data-tone="danger"] { background: var(--danger); color: #fff; }

/* ---- empty / loading / error (§32–34) ------------------------------------- */
.empty {
  display: grid; justify-items: center; gap: var(--sp-3);
  padding: var(--sp-12) var(--sp-5); text-align: center;
  border: 1px dashed var(--border-strong); border-radius: var(--r-lg);
  background: var(--surface);
}
.empty .ico { color: var(--brand-500); opacity: .7; }
.empty h3 { font-size: var(--fs-h2); font-weight: 620; }
.empty p { font-size: var(--fs-sm); color: var(--text-secondary); max-width: 44ch; }

.skel { border-radius: var(--r-sm); background: var(--surface-sunken); position: relative; overflow: hidden; }
.skel::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--text-muted) 10%, transparent), transparent);
  animation: shimmer 1.3s infinite;
}
@keyframes shimmer { to { translate: 100% 0; } }
.skel-line { height: 12px; margin-bottom: var(--sp-2); }
.skel-kpi { height: 96px; }

/* ---- charts -------------------------------------------------------------- */
.chart { width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart .grid-line { stroke: var(--chart-grid); stroke-width: 1; }
.chart .axis-line { stroke: var(--chart-axis); stroke-width: 1; }
.chart .axis-text { font-size: 10.5px; fill: var(--text-muted); }
.chart .val-text  { font-size: 11px; fill: var(--text-secondary); font-variant-numeric: tabular-nums; }
.chart .bar { transition: opacity var(--dur-fast) var(--ease); }
.chart:hover .bar:not(:hover) { opacity: .72; }

.legend { display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-4); margin-top: var(--sp-3); }
.legend-item { display: inline-flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-caption); color: var(--text-secondary); }
.legend-swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

/* Horizontal bar rows — the workhorse for ranked categories. */
.hbars { display: flex; flex-direction: column; gap: var(--sp-2); }
.hbar { display: grid; grid-template-columns: minmax(84px, 30%) 1fr auto; gap: var(--sp-3); align-items: center; font-size: var(--fs-caption); }
.hbar-label { color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar-track { height: 10px; border-radius: 5px; background: var(--chart-track); overflow: hidden; }
.hbar-fill { height: 100%; border-radius: 5px; background: var(--chart-1); }
.hbar-val { font-variant-numeric: tabular-nums; color: var(--text-primary); font-weight: 600; min-width: 34px; text-align: right; }
@media (max-width: 480px) { .hbar { grid-template-columns: minmax(64px, 38%) 1fr auto; } }

/* Funnel — stages nest, so each step reads as a share of the one above. */
.funnel { display: flex; flex-direction: column; gap: var(--sp-2); }
.fstep { display: grid; grid-template-columns: minmax(78px, 22%) 1fr 88px; gap: var(--sp-3); align-items: center; font-size: var(--fs-caption); }
.fstep-label { color: var(--text-secondary); }
.fstep-track { position: relative; display: flex; align-items: center; height: 28px; border-radius: var(--r-sm); background: var(--chart-track); overflow: hidden; }
.fstep-fill { height: 100%; border-radius: var(--r-sm); background: linear-gradient(90deg, var(--brand-600), var(--brand-400)); }
.fstep-num { position: absolute; left: var(--sp-3); font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text-primary); }
.fstep-conv { text-align: right; }
.fstep-conv b { display: block; font-variant-numeric: tabular-nums; color: var(--text-primary); }
.fstep-conv span { font-size: var(--fs-micro); color: var(--text-muted); }
@media (max-width: 480px) { .fstep { grid-template-columns: 66px 1fr 62px; } }

/* ---- pipeline board (§16) ------------------------------------------------- */
.board { display: flex; gap: var(--sp-3); overflow-x: auto; padding-bottom: var(--sp-3); }
.col {
  flex: 0 0 272px; display: flex; flex-direction: column; gap: var(--sp-2);
  background: var(--surface-sunken); border: 1px solid var(--border-subtle);
  border-radius: var(--r-lg); padding: var(--sp-3); min-height: 180px;
}
.col[data-over="true"] { border-color: var(--brand-500); background: color-mix(in srgb, var(--brand-500) 7%, var(--surface-sunken)); }
.col-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); }
.col-head h3 { font-size: var(--fs-micro); font-weight: 700; letter-spacing: var(--ls-caps); text-transform: uppercase; color: var(--text-secondary); }
.col-sum { font-size: var(--fs-micro); color: var(--text-muted); font-variant-numeric: tabular-nums; }
.dealcard {
  display: block; width: 100%; text-align: left;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-md); padding: var(--sp-3);
  box-shadow: var(--shadow-1); cursor: grab;
}
.dealcard:hover { border-color: var(--brand-400); }
.dealcard[data-dragging="true"] { opacity: .45; cursor: grabbing; }
.dealcard b { display: block; font-size: var(--fs-sm); font-weight: 620; }
.dealcard .co { display: block; font-size: var(--fs-caption); color: var(--text-muted); margin-bottom: var(--sp-2); }
.dealcard-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); margin-top: var(--sp-2); font-size: var(--fs-micro); color: var(--text-muted); }

/* ---- timeline (§22) ------------------------------------------------------- */
.timeline { position: relative; padding-left: var(--sp-5); }
.timeline::before { content: ""; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 1px; background: var(--border); }
.tl-item { position: relative; padding-bottom: var(--sp-4); }
.tl-item:last-child { padding-bottom: 0; }
.tl-item::before {
  content: ""; position: absolute; left: calc(var(--sp-5) * -1 + 2px); top: 5px;
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--surface); border: 2px solid var(--brand-500);
}
.tl-item b { display: block; font-size: var(--fs-sm); font-weight: 600; }
.tl-item p { font-size: var(--fs-caption); color: var(--text-secondary); margin-top: 2px; }
.tl-item time { display: block; font-size: var(--fs-micro); color: var(--text-muted); margin-top: 3px; }

/* ---- misc ---------------------------------------------------------------- */
.kv { display: grid; grid-template-columns: minmax(110px, 38%) 1fr; gap: var(--sp-2) var(--sp-3); font-size: var(--fs-sm); }
.kv dt { font-size: var(--fs-caption); color: var(--text-muted); }
.kv dd { color: var(--text-primary); overflow-wrap: anywhere; }

.filterbar { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: end; margin-bottom: var(--sp-4); }
.filterbar .field { margin: 0; min-width: 150px; flex: 1 1 150px; }
.filterbar .field > span { font-size: var(--fs-micro); }

.statusdot { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-micro); font-weight: 600; }
.statusdot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.statusdot[data-state="online"]  { color: var(--success); }
.statusdot[data-state="offline"] { color: var(--warning); }
/* Backed by a server, the state has more than two values. Colour never carries
   it alone — each state ships a word as well, and "syncing" also pulses so the
   difference from a settled "Synced" is not purely hue. */
.statusdot[data-state="synced"]  { color: var(--success); }
.statusdot[data-state="syncing"] { color: var(--brand-600); }
.statusdot[data-state="pending"] { color: var(--warning); }
.statusdot[data-state="error"]   { color: var(--danger); }
.statusdot[data-state="local"]   { color: var(--text-muted); }

.statusdot[data-state="syncing"]::before { animation: statuspulse 1.1s ease-in-out infinite; }
@keyframes statuspulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) {
  .statusdot[data-state="syncing"]::before { animation: none; }
}

/* Inline message block for form-level errors. role="alert" is on the element;
   this only makes it look like the interruption it is. */
.alert {
  display: block; padding: var(--sp-3) var(--sp-4);
  border: 1px solid var(--danger); border-left-width: 3px;
  border-radius: var(--r-sm);
  background: var(--danger-bg); color: var(--danger);
  font-size: var(--fs-caption); font-weight: 600;
}
.alert[hidden] { display: none; }
.alert[data-tone="info"] {
  border-color: var(--brand-500); background: var(--brand-50); color: var(--brand-700);
}

/* A button that reads as a link. Kept a real <button> because it performs an
   action rather than navigating, and a link that does not go anywhere is a
   problem for anyone driving the page from the keyboard. */
.linkbtn {
  background: none; border: 0; padding: 0;
  font: inherit; color: var(--brand-600);
  text-decoration: underline; text-underline-offset: 2px; cursor: pointer;
}
.linkbtn:hover { color: var(--brand-700); }

.scorebar { display: flex; flex-direction: column; gap: var(--sp-2); }
.scoreline {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(90px, 22%) 44px;
  gap: var(--sp-3); align-items: center; font-size: var(--fs-caption);
}
.scoreline-track { height: 8px; border-radius: 4px; background: var(--chart-track); overflow: hidden; }
.scoreline-fill { height: 100%; background: var(--brand-500); border-radius: 4px; }
@media (max-width: 520px) { .scoreline { grid-template-columns: minmax(0,1fr) 64px 40px; gap: var(--sp-2); } }
.scoreline[data-hit="false"] { opacity: .48; }
.scoreline[data-hit="false"] .scoreline-fill { background: var(--text-muted); }

</style>
</head>
